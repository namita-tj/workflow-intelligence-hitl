[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-intelligence-hitl"
version = "1.0.0"
description = "HITL AI system for surfacing tribal operational intelligence from delivery workflow data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Namita T J" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "scipy",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
]

[tool.setuptools.packages.find]
include = ["hitl*"]

[project.scripts]
workflow-hitl = "main:main"