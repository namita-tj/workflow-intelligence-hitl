[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-intelligence-hitl"
version = "1.0.0"
description = "A human-in-the-loop system for surfacing and validating tribal knowledge from organisational workflow data (bachelor's thesis)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Namita Thangavel Jeyaradha" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "scipy",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyter",
]

[tool.setuptools]
py-modules = ["main"]  # so the workflow-hitl command below can import main.py

[tool.setuptools.packages.find]
include = ["hitl*"]

[project.scripts]
workflow-hitl = "main:main"